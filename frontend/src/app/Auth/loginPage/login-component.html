<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login component</title>

</head>
<body>
<div class="login-container">
  <!-- Top Header Section -->
  <div class="header">
    <div class="icon-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
        <polyline points="10 17 15 12 10 7"></polyline>
        <line x1="15" y1="12" x2="3" y2="12"></line>
      </svg>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Log in to your account</p>
  </div>

  <!-- Card Form Section -->
  <div class="login-card">
    <button type="button" class="google-btn" (click)="loginWithGoogle()">
      <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email Input Field -->
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper" [class.focused]="isEmailFocused">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="you@example.com"
            (focus)="isEmailFocused = true"
            (blur)="isEmailFocused = false"
          />
        </div>
      </div>

      <!-- Password Input Field -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="javascript:void(0)" class="forgot-link" (click)="onForgotPassword()">Forgot password?</a>
        </div>
        <div class="input-wrapper" [class.focused]="isPasswordFocused">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            type="password"
            id="password"
            formControlName="password"
            placeholder="••••••••"
            (focus)="isPasswordFocused = true"
            (blur)="isPasswordFocused = false"
          />
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Log in</button>
    </form>
  </div>

  <!-- Bottom Link -->
  <p class="footer-text">
    Don't have an account? <a href="javascript:void(0)" (click)="onSignUp()">Create one</a>
  </p>
</div>

  <!-- Footer Link -->
  <p class="footer-text">
    Don't have an account? <a href="#" (click)="$event.preventDefault(); onSignUp()">Create one</a>
  </p>
</div>
</body>
</html>
